seed: 0
backbone: resnet50
pretrained: true
data:
  nih_root: @CXR_CLUSTER_ROOT@/data/raw/nih_chestxray14/images
  manifest_path: @CXR_CLUSTER_ROOT@/original_checkpoints/data/nih_pneumothorax_multilabel.csv
  image_size: 224
train:
  epochs: 20
  batch_size: 128
  micro_batch: 32
  lr: 0.0004
  lr_step_size: 5
  lr_gamma: 0.5
  num_workers: 16
  label_columns:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Pneumothorax
  - Mass
  - Nodule
  - Pleural_Thickening
  - Pneumonia
  - Hernia
  - Infiltration
  class_weighting: true
  checkpoint_selection: true
output_dir: @CXR_CLUSTER_ROOT@/replication_512_ctl224/outputs/e5ctl224_resnet50
final_checkpoint_archive_dir: @CXR_CLUSTER_ROOT@/replication_512_ctl224/checkpoints_archive
