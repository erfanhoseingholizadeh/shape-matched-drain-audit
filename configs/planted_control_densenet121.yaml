
seed: 0
backbone: densenet121
pretrained: true

data:
  nih_root: data/raw/nih_chestxray14/images
  manifest_path: review/planted_control/outputs/resolved_manifest_{strength}.csv
  image_size: 224
  image_path_column: resolved_path

train:
  epochs: 20
  batch_size: 128
  lr: 0.0004
  lr_step_size: 5
  lr_gamma: 0.5
  num_workers: 16
  label_columns: [Atelectasis, Cardiomegaly, Consolidation, Edema, Effusion, Emphysema, Fibrosis, Pneumothorax, Mass, Nodule, Pleural_Thickening, Pneumonia, Hernia, Infiltration]
  class_weighting: true
  checkpoint_selection: true

output_dir: outputs/planted_control_{strength}
final_checkpoint_archive_dir: checkpoints_archive
