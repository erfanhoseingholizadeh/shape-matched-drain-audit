seed: 0
backbone: densenet121
pretrained: true
data:
  nih_root: @CXR_CLUSTER_ROOT@/data/raw/nih_chestxray14/images
  manifest_path: @CXR_CLUSTER_ROOT@/planted_control/outputs/resolved_manifest_e3lo.csv
  image_size: 224
  image_path_column: resolved_path
train:
  epochs: 20
  batch_size: 128
  lr: 0.0004
  lr_step_size: 5
  lr_gamma: 0.5
  num_workers: 16
  label_columns:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Pneumothorax
  - Mass
  - Nodule
  - Pleural_Thickening
  - Pneumonia
  - Hernia
  - Infiltration
  class_weighting: true
  checkpoint_selection: true
output_dir: @CXR_CLUSTER_ROOT@/further_runs/outputs/e3_densenet121_e3lo
final_checkpoint_archive_dir: @CXR_CLUSTER_ROOT@/further_runs/checkpoints_archive
