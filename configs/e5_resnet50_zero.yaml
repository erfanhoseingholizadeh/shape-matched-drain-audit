seed: 0
backbone: resnet50
pretrained: true
data:
  nih_root: @CXR_CLUSTER_ROOT@/data/raw/nih_chestxray14/images
  manifest_path: @CXR_CLUSTER_ROOT@/planted_control/outputs/resolved_manifest_zero.csv
  image_size: 512
  image_path_column: resolved_path
train:
  epochs: 20
  batch_size: 128
  micro_batch: 32
  lr: 0.0004
  lr_step_size: 5
  lr_gamma: 0.5
  num_workers: 16
  label_columns:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Pneumothorax
  - Mass
  - Nodule
  - Pleural_Thickening
  - Pneumonia
  - Hernia
  - Infiltration
  class_weighting: true
  checkpoint_selection: true
output_dir: @CXR_CLUSTER_ROOT@/replication_512/outputs/e5_resnet50_zero
final_checkpoint_archive_dir: @CXR_CLUSTER_ROOT@/replication_512/checkpoints_archive
